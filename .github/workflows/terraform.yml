name: "Terraform CI/CD"

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    terraform: 
        name: "Terraform"
        runs-on: [self-hosted,terraform-runner]

        defaults:
            run:
                working-directory: ./terraform

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Format
              run: terraform fmt -check

            - name: Terraform Init
              run: terraform init

            - name: Terraform Validate
              run: terraform validate

            - name: Terraform Plan
              run: terraform plan -out=tfplan
              env:
                TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
                TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
                TF_VAR_proxmox_insecure: ${{ secrets.PROXMOX_INSECURE }}
                TF_VAR_vm_dns_list: ${{ secrets.VM_DNS_LIST }}
                TF_VAR_vm_user_account: ${{ secrets.VM_USER_ACCOUNT }}
                TF_VAR_proxmox_user: ${{ secrets.PROXMOX_USER }}
                TF_VAR_private_key: ${{ secrets.PRIVATE_KEY }}
                TF_VAR_node_name: ${{ secrets.NODE_NAME }}
                TF_VAR_node_address: ${{ secrets.NODE_ADDRESS }}
                TF_VAR_node_port: ${{ secrets.NODE_PORT }}
                TF_VAR_datastore_id: ${{ secrets.DATASTORE_ID }}
                TF_VAR_iso_datastore_id: ${{ secrets.ISO_DATASTORE_ID }}
                TF_VAR_vm_user_key: ${{ secrets.VM_USER_KEY }}

            - name: Terraform Apply
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              run: terraform apply -auto-approve tfplan
              env:
                TF_VAR_proxmox_endpoint: ${{ secrets.PROXMOX_ENDPOINT }}
                TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
                TF_VAR_proxmox_insecure: ${{ secrets.PROXMOX_INSECURE }}
                TF_VAR_vm_dns_list: ${{ secrets.VM_DNS_LIST }}
                TF_VAR_vm_user_account: ${{ secrets.VM_USER_ACCOUNT }}
                TF_VAR_proxmox_user: ${{ secrets.PROXMOX_USER }}
                TF_VAR_private_key: ${{ secrets.PRIVATE_KEY }}
                TF_VAR_node_name: ${{ secrets.NODE_NAME }}
                TF_VAR_node_address: ${{ secrets.NODE_ADDRESS }}
                TF_VAR_node_port: ${{ secrets.NODE_PORT }}
                TF_VAR_datastore_id: ${{ secrets.DATASTORE_ID }}
                TF_VAR_iso_datastore_id: ${{ secrets.ISO_DATASTORE_ID }}
                TF_VAR_vm_user_key: ${{ secrets.VM_USER_KEY }}
